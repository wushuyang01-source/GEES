<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title data-translate="essPageTitle">ESS (Electric Steering System) - General Energies</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/product.css">
    <link rel="stylesheet" href="../../css/languageswitcher.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <div id="header-placeholder"></div>

  <!-- Hero Section -->
  <section class="hero">
      <div class="hero-container">
          <div class="hero-content">
              <h1 class="hero-title" data-translate="essSystemTitle">ESS (Electric Steering System)</h1>
              <p class="hero-subtitle" data-translate="newBuildAndRetrofit">New Build and Retrofit</p>
              <div class="hero-features">
                  <span class="feature-tag" data-translate="energySaving">ENERGY SAVING</span>
                  <span class="feature-tag" data-translate="stableAndReliable">RELIABLE</span>
                  <span class="feature-tag" data-translate="compactness">COMPACT</span>
              </div>
          </div>
          <div class="hero-image">
              <!-- 替换为实际图片 -->
              <img src="../img/product/ess-hero.png" alt="Electric Steering System (ESS)" style="max-width:100%; height:auto;">
          </div>
      </div>
  </section>

  <!-- Product Overview -->
  <section class="product-overview">
    <div class="overview-grid" style="display:flex; justify-content:center;">
      <div class="overview-text" style="max-width:900px; padding:20px;">
        <h3 style="text-align:center;" data-translate="essOverviewTitle">Electric Steering System — ESS 电动舵机系统</h3>

        <p data-translate="essOverviewEN" style="text-align:justify;"></p>

        <!-- 居中示意图 -->
        <img src="../img/product/ess-diagram.png" alt="ESS diagram" style="display:block; margin:20px auto; max-width:100%; height:auto;">
      </div>
    </div>
  </section>


  <!-- Specifications Section -->
    <section class="specifications">
        <div class="container">
            <h2 class="section-title" data-translate="scsstyle">VHD Technical Specifications</h2>
            <div class="spec-grid">
                <div class="spec-category">
                    <h3 data-translate="composition">Composition:</h3>
                    <div class="spec-table">
                        <div class="spec-row">
                            <span class="spec-label" data-translate="electriclinearactuators"> electric linear actuators:</span>
                            <span class="spec-value">2</span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label" data-translate="servomotors"></span>
                            <span class="spec-value">2</span>
                        </div>
                       
                        <div class="spec-row">
                            <span class="spec-label" data-translate="localcontrolpanels">Body:</span>
                            <span class="spec-value">2</span>
                        </div>

                        <div class="spec-row">
                            <span class="spec-label" data-translate="bridgedisplays"></span>
                            <span class="spec-value">2</span>
                        </div>

                        <div class="spec-row">
                            <span class="spec-label" data-translate="steeringwheel"></span>
                            <span class="spec-value">1</span>
                        </div> 

                        <div class="spec-row">
                            <span class="spec-label" data-translate="independentalarmbuzzers"></span>
                            <span class="spec-value">2</span>
                        </div> 
                        
                        
                    </div>
                </div>

                <div class="spec-category">
                    <h3 data-translate="essadvantages"></h3>
                    <div class="spec-table">
                        <div class="spec-row">
                           <span class="spec-label" data-translate="Highenergyconversion"  style="display:inline-block; min-width:500px;"></span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label" data-translate="Nohydraulicleaks"></span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label" data-translate="Smallfootprint"></span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label" data-translate="Dualpowersupply"></span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label" data-translate="Localrudderangle"></span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label" data-translate="Designedforretrofit"></span>
                        </div>
                    </div>
                </div>

                <div class="spec-category">
                    <h3 data-translate="essPerformance"></h3>
                    <div class="spec-table">
                        <div class="spec-row">
                            <span class="spec-label" data-translate="Actuatorload"></span>
                            <span class="spec-value">2500N~5000N</span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label" data-translate="Rudderangle"></span>
                            <span class="spec-value">±35°</span>
                        </div>
                        <div class="spec-row">
                            <span class="spec-label" data-translate="Powersupply"></span>
                            <span class="spec-value"> AC 380V & DC 24V</span>
                        </div>
                       
                    </div>
                </div>
            </div>
        </div>
    </section>

  <!-- Actuator Details -->
  <section class="product-details">
    <div class="container" style="max-width:1100px; margin:auto;">
      <h3 style="text-align:center; color:#0369a1;" translate="scsimage"></h3>
      <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="../img/product/SCS1.png" alt="SCS Rendering View">
                    <div class="gallery-overlay">
                        <span data-translate="Renderedimage">Rendering View</span>
                    </div>
                </div>
                <div class="gallery-item">
                    <img src="../img/product/SCS2.png" alt="SCS Rendering View">
                    <div class="gallery-overlay">
                        <span data-translate="Renderedimage">Rendering View</span>
                    </div>
                </div>
            </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="../js/translations.js"></script>
  <script src="../js/language-switcher.js"></script>
  <script src="../js/load-footer.js"></script>
  <script src="../../js/load-header.js"></script>
</body>
</html>
